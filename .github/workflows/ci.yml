name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Create environment
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      # mypy reads the installed numpy/pandas stubs, and current numpy stubs use
      # 3.12 syntax. Type-checking on the newest supported interpreter is enough;
      # the runtime behaviour on 3.11 is covered by the test job below.
      - name: Types (mypy)
        if: matrix.python-version == '3.12'
        run: uv run mypy

      # ffmpeg is not installed here on purpose: it proves the unit suite is
      # genuinely offline. Tests that need the binary are marked `integration`
      # and skip themselves.
      - name: Tests (offline unit suite)
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore
