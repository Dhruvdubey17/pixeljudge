[project]
name = "pixeljudge"
version = "0.1.0"
description = "Full-reference video quality analysis: PSNR/SSIM/VMAF across encoding ladders, plus a MOS regressor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhruv Dubey" }]
keywords = ["video-quality", "vmaf", "ffmpeg", "psnr", "ssim", "bd-rate"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.9",
  "matplotlib>=3.8",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Experiment/data tracking is genuinely optional: the pipeline runs without it.
tracking = ["mlflow>=2.12", "dvc>=3.50"]

[project.urls]
Homepage = "https://github.com/Dhruvdubey17/pixeljudge"

[project.scripts]
pixeljudge = "pixeljudge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixeljudge"]

# ---------------------------------------------------------------------------
# Tooling. Line length is kept identical for ruff and black so they never
# disagree about where a line should wrap.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "UP",  # pyupgrade: modern syntax
  "B",   # bugbear: likely bugs
  "SIM", # simplifiable code
  "C4",  # comprehension style
  "RET", # return-statement hygiene
]
ignore = [
  "E501", # black already enforces line length; ruff flagging it too is noise
  "B008", # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# No python_version pin: mypy checks against the interpreter it runs on, which
# keeps it consistent with whatever numpy/pandas stubs are installed there.
files = ["src", "tests", "scripts"]
strict = true
# Some scientific packages ship no type information; we still type our own code
# strictly, we just cannot demand stubs from them.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "matplotlib.*",
  "mpl_toolkits.*",
  "skimage.*",
  "sklearn.*",
  "scipy.*",
  "mlflow.*",
  "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs a real ffmpeg binary (skipped automatically when absent)",
  "slow: long-running encode or measurement",
]

[tool.coverage.run]
source = ["src/pixeljudge"]
